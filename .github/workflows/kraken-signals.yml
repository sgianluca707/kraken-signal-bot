name: Kraken Signal Bot 3.0

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia solo un messaggio di prova Telegram"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: kraken-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlla sintassi e configurazione
        run: |
          python -m py_compile bot.py
          python bot.py --validate

      - name: Test Telegram
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --test-telegram

      - name: Esegui scansione Kraken
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Salva stato e storico
        if: ${{ success() && !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        run: |
          if [ ! -f .state_changed ]; then
            echo "Nessun nuovo segnale o risultato: nessun commit necessario."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json signal_history.csv
          git commit -m "Aggiorna stato bot [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ Test riuscito: Kraken Signal Bot è collegato a Telegram."

      - name: Esegui scansione Kraken
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Salva memoria segnali
        run: |
          if git diff --quiet -- state.json; then
            echo "Nessun aggiornamento da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Aggiorna memoria segnali"
          git push
